<svg xmlns="http://www.w3.org/2000/svg" width="180" height="108" viewBox="0 0 180 108">
  <defs>
    <pattern id="ascii-ramp" width="180" height="108" patternUnits="userSpaceOnUse">
      <g fill="#fff" fill-opacity=".2" font-family="monospace" font-size="10" letter-spacing="1.6">
        <text x="0" y="12">@#S08Xx+=-;:,.@#S08Xx+=-;:,.@#S08Xx</text>
        <text x="9" y="27">#S08Xx+=-;:,.@#S08Xx+=-;:,.@#S08Xx+</text>
        <text x="-4" y="42">08Xx+=-;:,.@#S08Xx+=-;:,.@#S08Xx+=</text>
        <text x="14" y="57">S08Xx+=-;:,.@#S08Xx+=-;:,.@#S08Xx</text>
        <text x="0" y="72">Xx+=-;:,.@#S08Xx+=-;:,.@#S08Xx+=-</text>
        <text x="11" y="87">#S08Xx+=-;:,.@#S08Xx+=-;:,.@#S08Xx+</text>
        <text x="-2" y="102">08Xx+=-;:,.@#S08Xx+=-;:,.@#S08Xx</text>
      </g>
    </pattern>
  </defs>
  <rect width="180" height="108" fill="url(#ascii-ramp)" />
</svg>
