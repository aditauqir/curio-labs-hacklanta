<svg xmlns="http://www.w3.org/2000/svg" width="220" height="132" viewBox="0 0 220 132">
  <defs>
    <pattern id="ascii-ramp" width="220" height="132" patternUnits="userSpaceOnUse">
      <g fill="#fff" fill-opacity=".16" font-family="monospace" font-size="11" letter-spacing="2">
        <text x="0" y="14">@#S08Xx+=-;:,.@#S08Xx+=-;:,.@#S08Xx</text>
        <text x="14" y="34">08Xx+=-;:,.@#S08Xx+=-;:,.@#S08Xx+</text>
        <text x="0" y="54">#S08Xx+=-;:,.@#S08Xx+=-;:,.@#S08Xx</text>
        <text x="18" y="74">Xx+=-;:,.@#S08Xx+=-;:,.@#S08Xx+=</text>
        <text x="0" y="94">S08Xx+=-;:,.@#S08Xx+=-;:,.@#S08Xx</text>
        <text x="12" y="114">x+=-;:,.@#S08Xx+=-;:,.@#S08Xx+=-</text>
      </g>
    </pattern>
  </defs>
  <rect width="220" height="132" fill="url(#ascii-ramp)" />
</svg>
