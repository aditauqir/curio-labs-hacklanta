[project]
name = "curio-labs"
version = "0.1.0"
description = "Curio Labs raster design engine: deterministic image operations, layers, type and a versioned style library. No generative image models."
requires-python = ">=3.12"
dependencies = [
  "numpy>=2",
  "scipy>=1.13",
  "pillow>=10.1",
  "opencv-python-headless>=4.9",
  "fonttools>=4.50",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Publishing to and loading from TigerData (PostgreSQL). Offline use only.
db = ["psycopg[binary]>=3.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["curio*"]

[tool.pytest.ini_options]
testpaths = ["curio/tests"]
addopts = "-q"
