name: Deploy Curio Labs to Vultr

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vultr-production
  cancel-in-progress: false

jobs:
  build:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build application
        run: npm run build

  deploy:
    name: Deploy to Vultr
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VULTR_SSH_KEY }}
          VULTR_HOST: ${{ secrets.VULTR_HOST }}
        run: |
          set -euo pipefail

          if [[ -z "$SSH_KEY" || -z "$VULTR_HOST" ]]; then
            echo "VULTR_SSH_KEY and VULTR_HOST must be configured"
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          newline=$'\n'
          normalized_key="${SSH_KEY//\\n/$newline}"
          normalized_key="${normalized_key//$'\r'/}"
          if [[ "$normalized_key" == \"*\" ]]; then
            normalized_key="${normalized_key:1:${#normalized_key}-2}"
          fi

          printf '%s\n' "$normalized_key" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          if ! ssh-keygen -y -P "" -f ~/.ssh/id_ed25519 > /dev/null 2>&1; then
            if [[ "$normalized_key" != *"PRIVATE KEY"* ]]; then
              decoded_key=$(mktemp)
              if printf '%s' "$normalized_key" | base64 --decode > "$decoded_key" 2>/dev/null; then
                chmod 600 "$decoded_key"
                if ssh-keygen -y -P "" -f "$decoded_key" > /dev/null 2>&1; then
                  mv "$decoded_key" ~/.ssh/id_ed25519
                else
                  rm -f "$decoded_key"
                fi
              else
                rm -f "$decoded_key"
              fi
            fi
          fi

          if ! ssh-keygen -y -P "" -f ~/.ssh/id_ed25519 > /dev/null 2>&1; then
            echo "VULTR_SSH_KEY must be an unencrypted private SSH key, plain or base64 encoded"
            exit 1
          fi

          # The server host key changes when a Vultr instance is rebuilt. Refresh
          # the entry so a stale VULTR_KNOWN_HOSTS secret cannot block deploys.
          ssh-keyscan -T 10 -H "$VULTR_HOST" > ~/.ssh/known_hosts 2>/dev/null
          if [[ ! -s ~/.ssh/known_hosts ]]; then
            echo "Could not retrieve an SSH host key for $VULTR_HOST"
            exit 1
          fi

          chmod 600 ~/.ssh/known_hosts

      - name: Deploy application
        env:
          VULTR_HOST: ${{ secrets.VULTR_HOST }}
          VULTR_USER: ${{ secrets.VULTR_USER }}
        run: |
          ssh -o BatchMode=yes "$VULTR_USER@$VULTR_HOST" 'bash -se' <<'EOF'
            set -euo pipefail

            cd /var/www/curiolabs

            previous_sha=$(git rev-parse HEAD)

            rollback() {
              echo "Deployment failed. Restoring previous release ${previous_sha}..."
              if [ "$(git rev-parse HEAD)" != "$previous_sha" ]; then
                git reset --hard "$previous_sha"
                npm ci
                npm run build
                pm2 restart curiolabs --update-env
              fi
            }
            trap rollback ERR

            echo "Fetching latest code..."
            git fetch origin main
            git merge --ff-only origin/main

            echo "Installing dependencies..."
            npm ci

            echo "Building Next.js..."
            npm run build

            echo "Restarting application..."
            pm2 restart curiolabs --update-env

            echo "Checking server health..."
            curl --fail --silent --show-error \
              --retry 10 --retry-delay 2 --retry-connrefused \
              http://127.0.0.1:3000/ > /dev/null

            trap - ERR
            echo "Deployed $(git rev-parse --short HEAD)"
            echo "Deployment successful!"
          EOF

      - name: Verify public endpoint
        env:
          VULTR_HOST: ${{ secrets.VULTR_HOST }}
        run: |
          curl --fail --silent --show-error \
            --retry 10 --retry-delay 3 --retry-connrefused \
            --max-time 15 \
            "http://${VULTR_HOST}/" > /dev/null
          echo "Public endpoint is responding."
