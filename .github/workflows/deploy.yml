name: Deploy Curio Labs to Vultr

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vultr-production
  cancel-in-progress: false

jobs:
  build:
    name: Build Next.js
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

  deploy:
    name: Deploy to Vultr
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VULTR_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VULTR_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy application
        env:
          VULTR_HOST: ${{ secrets.VULTR_HOST }}
          VULTR_USER: ${{ secrets.VULTR_USER }}
        run: |
          ssh -o BatchMode=yes "$VULTR_USER@$VULTR_HOST" 'bash -se' <<'EOF'
            set -euo pipefail

            cd /var/www/curiolabs

            echo "Fetching latest code..."
            git fetch origin main
            git merge --ff-only origin/main

            echo "Installing dependencies..."
            npm ci

            echo "Building Next.js..."
            npm run build

            echo "Restarting application..."
            pm2 restart curiolabs --update-env

            echo "Checking server health..."
            curl --fail --silent --show-error \
              --retry 5 --retry-delay 2 \
              http://127.0.0.1:3000/ > /dev/null

            echo "Deployment successful!"
          EOF
