name: Deploy Curio Labs to Vultr

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vultr-production
  cancel-in-progress: false

jobs:
  build:
    name: Build Next.js
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

  deploy:
    name: Deploy to Vultr
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VULTR_SSH_KEY }}
          VULTR_HOST: ${{ secrets.VULTR_HOST }}
        run: |
          set -euo pipefail

          if [[ -z "$SSH_KEY" || -z "$VULTR_HOST" ]]; then
            echo "VULTR_SSH_KEY and VULTR_HOST must be configured"
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          newline=$'\n'
          normalized_key="${SSH_KEY//\\n/$newline}"
          normalized_key="${normalized_key//$'\r'/}"
          printf '%s\n' "$normalized_key" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          if ! ssh-keygen -y -P "" -f ~/.ssh/id_ed25519 > /dev/null 2>&1; then
            echo "VULTR_SSH_KEY is not a readable, unencrypted private SSH key"
            exit 1
          fi

          # The server host key changes when a Vultr instance is rebuilt. Refresh
          # the entry so a stale VULTR_KNOWN_HOSTS secret cannot block deploys.
          ssh-keyscan -T 10 -H "$VULTR_HOST" > ~/.ssh/known_hosts 2>/dev/null
          if [[ ! -s ~/.ssh/known_hosts ]]; then
            echo "Could not retrieve an SSH host key for $VULTR_HOST"
            exit 1
          fi

          chmod 600 ~/.ssh/known_hosts

      - name: Deploy application
        env:
          VULTR_HOST: ${{ secrets.VULTR_HOST }}
          VULTR_USER: ${{ secrets.VULTR_USER }}
        run: |
          ssh -o BatchMode=yes "$VULTR_USER@$VULTR_HOST" 'bash -se' <<'EOF'
            set -euo pipefail

            cd /var/www/curiolabs

            echo "Fetching latest code..."
            git fetch origin main
            git merge --ff-only origin/main

            echo "Installing dependencies..."
            npm ci

            echo "Building Next.js..."
            npm run build

            echo "Restarting application..."
            pm2 restart curiolabs --update-env

            echo "Checking server health..."
            curl --fail --silent --show-error \
              --retry 5 --retry-delay 2 \
              http://127.0.0.1:3000/ > /dev/null

            echo "Deployment successful!"
          EOF
